# QuantSim frontend -- static bundle, nothing else.
#
# Port 5173 rather than 80 because the gateway's allowed CORS origin is the
# compile-time constant "http://localhost:5173" (services/gateway/cmd/server/
# main.go). Serving this anywhere else makes every API call fail preflight,
# which reads as a broken gateway rather than a moved port. SPEC.md 2.9.

server {
    listen       5173;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No SPA fallback, on purpose. App.tsx records that react-router-dom was
    # deliberately not added, so there are no client-side routes and nothing to
    # fall back for. `try_files $uri /index.html` would turn every typo and
    # every stale bookmark into a silent index page instead of a 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL.
    #
    # One directive, not `expires 1y` plus an add_header: those emit two
    # separate Cache-Control headers and leave which one wins up to the client.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file that is not fingerprinted, and therefore the one that must
    # never be cached: it is what points at the current bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;
}
