# QuantSim — Postgres and Redis for local development, and the whole stack
# behind the "app" profile.
#
# Two ways to run, and they must not collide:
#
#   docker compose up -d                    datastores only. The daily loop:
#                                           Postgres and Redis in Docker, the
#                                           services with `go run` so a code
#                                           change is one restart away.
#   docker compose --profile app up -d      everything, containerised.
#
# The app services sit behind a profile precisely so the first command keeps
# meaning what it has always meant. Without that, `make docker-up` would start
# seven containers and then host processes would race them for 8080-8085.
# pgAdmin already uses the same mechanism (the "tools" profile) below.
#
# Every published port is bound to 127.0.0.1 on purpose. Docker publishes
# ports by writing NAT rules that bypass the host firewall, so "0.0.0.0:6379"
# in a compose file really does mean "reachable from anyone on the network" --
# and Redis here has no password at all. The Go services bind to loopback for
# the same reason (see BIND_ADDR in .env.example); leaving the datastores
# behind them exposed would defeat that entirely.
#
# Under the app profile only the gateway (8080) and the frontend (5173) are
# published. auth, market-data, trading-engine, backtesting and ai-insights
# are reachable only from the compose network, which is a stronger boundary
# than they have under `make run-*`, where they sit on the host's loopback.

# The connection strings the containers use. These deliberately do NOT come
# from .env: the URLs in that file name `localhost`, which is correct for
# `make run-*` and wrong inside a container, where the hosts are the compose
# service names. Only the portable half -- the credentials -- is read from
# .env, so neither set of values can drift into the other.
#
# The database name is POSTGRES_APP_DB and NOT POSTGRES_DB, and that is the
# single most important line in this file.
#
# POSTGRES_DB names the database the postgres image creates at first boot.
# In this project it is `quantsim`, which is an EMPTY DECOY -- the application
# lives in the database named `postgres`, which is what DATABASE_URL has always
# said. README.md and docs/PHASE2_CHECKLIST.md both record this on purpose.
#
# Deriving the container URL from POSTGRES_DB therefore points the whole stack
# at the wrong database, and it does not look like a failure: the migrate
# one-shot obligingly creates the schema there, registration returns 201,
# orders fill, and only a report that needs pre-existing bars gives it away.
# Measured, not imagined -- it is what the first run of this file did.
#
# The default is `postgres` because that is what both .env and .env.example
# name in DATABASE_URL. Set POSTGRES_APP_DB only if you move the application
# to a differently-named database, and change DATABASE_URL to match.
#
# POSTGRES_PASSWORD is interpolated into a URL here. A password containing
# @ : / or # will produce a connection string that parses wrong or not at all.
# See the note in .env.example where the password is set.
x-database-url: &database-url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_APP_DB:-postgres}?sslmode=disable"
x-redis-url: &redis-url "redis://redis:6379/0"

# What every Go service shares.
#
# BIND_ADDR is the one that matters. Every service defaults it to 127.0.0.1,
# and .env sets it there too, both on purpose: auth and market-data have no
# authentication of their own and expect the gateway in front of them. Inside
# a container 127.0.0.1 is the container's OWN loopback, so a service bound
# there is reachable by nothing, including the gateway on this network. The
# symptom is `connection refused` from the gateway while the service happily
# logs that it is listening. This is the case .env.example's comment carves
# out: 0.0.0.0 only behind a real network boundary. The boundary is the ports
# section above -- these services publish nothing.
#
# read_only holds because the services write no files. It is a constraint
# rather than decoration, and it is verified rather than assumed.
#
# depends_on names migrations and nothing else. Redis needs no ordering: every
# client connects lazily and the first request is a human away, long after a
# container that reports healthy in under a second.
x-go-service: &go-service
  profiles:
    - app
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    container_name: quantsim-postgres
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - quantsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: quantsim-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - quantsim_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: pgAdmin at http://localhost:5050 (email/password from env or below)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quantsim-pgadmin
    profiles:
      - tools
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@quantsim.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  # --- the app profile -----------------------------------------------------

  # Migrations, as a one-shot every service waits on.
  #
  # This removes the golang-migrate CLI from the prerequisites for running the
  # stack, and it makes "code newer than schema" impossible to start with,
  # rather than something discovered as a 500 from a missing column.
  #
  # `up` on an already-migrated database is a no-op, so restarts are free. A
  # DIRTY migration state fails this container and therefore stops every
  # service that waits on it, which is the right outcome: the alternative is
  # six services starting against a half-applied schema.
  #
  # `make migrate-up` on the host is unchanged and still serves the `go run`
  # loop. Two paths to the same migrations is a small cost; the alternative is
  # worse in both directions.
  migrate:
    image: migrate/migrate:v4.19.0
    container_name: quantsim-migrate
    profiles:
      - app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_APP_DB:-postgres}?sslmode=disable
      - up

  auth:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: auth
    image: quantsim-auth
    container_name: quantsim-auth
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8081"
      BIND_ADDR: 0.0.0.0

  # The only service that gets the Alpaca credentials. Under `make run-*` the
  # Makefile exports all of .env to every process, so the gateway holds
  # ALPACA_API_SECRET it will never use. Splitting it here costs nothing.
  market-data:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: market-data
    image: quantsim-market-data
    container_name: quantsim-market-data
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      PORT: "8082"
      BIND_ADDR: 0.0.0.0

  # REDIS_URL here is Step 24: a fill deletes the placing user's cached report
  # so GET /insights/portfolio reflects the trade they just made. It is
  # optional and orders place without it -- which is exactly why it is set
  # explicitly, because a deployment that omits it reintroduces that defect
  # silently.
  trading-engine:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: trading-engine
    image: quantsim-trading-engine
    container_name: quantsim-trading-engine
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: *redis-url
      JWT_SECRET: ${JWT_SECRET}
      MARKET_DATA_SERVICE_URL: http://market-data:8082
      PORT: "8083"
      BIND_ADDR: 0.0.0.0

  backtesting:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: backtesting
    image: quantsim-backtesting
    container_name: quantsim-backtesting
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET}
      MARKET_DATA_SERVICE_URL: http://market-data:8082
      PORT: "8084"
      BIND_ADDR: 0.0.0.0

  # No DATABASE_URL: this service owns no tables. The only container holding
  # the Anthropic key, and both of its variables are optional -- without them
  # the report endpoint is unaffected and the narrative endpoint returns 200
  # with narrative: null.
  ai-insights:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: ai-insights
    image: quantsim-ai-insights
    container_name: quantsim-ai-insights
    environment:
      REDIS_URL: *redis-url
      JWT_SECRET: ${JWT_SECRET}
      TRADING_ENGINE_SERVICE_URL: http://trading-engine:8083
      MARKET_DATA_SERVICE_URL: http://market-data:8082
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      PORT: "8085"
      BIND_ADDR: 0.0.0.0

  # The only API port published. Every RATE_LIMIT_* knob has a working default
  # in the gateway itself and treats empty as unset, so passing them through
  # unset leaves the Go defaults in charge rather than duplicating them here.
  # Publishes NOTHING as of Step 26. The browser reaches the API through the
  # frontend container, which serves the bundle and proxies these prefixes
  # under one origin, so the gateway is reachable only from this network --
  # locally and deployed alike.
  gateway:
    <<: *go-service
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    image: quantsim-gateway
    container_name: quantsim-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      # The single most important line here.
      #
      # With a proxy in front, r.RemoteAddr is the proxy on every request, so
      # the per-IP limiter works perfectly on ONE key for everybody -- 100
      # requests per 15 minutes shared by the entire internet, arriving as
      # "login is broken" rather than as a rate limit. This names the one hop
      # whose X-Forwarded-For may be believed.
      #
      # It is the frontend's fixed address and not the whole subnet: every
      # container here is ours, but only one of them is a proxy.
      TRUSTED_PROXIES: 172.28.0.10/32
      # Inert while everything is same-origin, and it still has to be right:
      # this middleware is what would refuse a genuine cross-origin request.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth:8081
      MARKET_DATA_SERVICE_URL: http://market-data:8082
      TRADING_ENGINE_SERVICE_URL: http://trading-engine:8083
      BACKTESTING_SERVICE_URL: http://backtesting:8084
      INSIGHTS_SERVICE_URL: http://ai-insights:8085
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_IP_REQUESTS: ${RATE_LIMIT_IP_REQUESTS:-}
      RATE_LIMIT_IP_WINDOW: ${RATE_LIMIT_IP_WINDOW:-}
      RATE_LIMIT_LOGIN_FAILURES: ${RATE_LIMIT_LOGIN_FAILURES:-}
      RATE_LIMIT_LOGIN_MAX_BACKOFF: ${RATE_LIMIT_LOGIN_MAX_BACKOFF:-}
      PORT: "8080"
      BIND_ADDR: 0.0.0.0

  # Caddy: the bundle AND the API, under one origin.
  #
  # Port 5173 locally because that is where the Vite dev server lives, so the
  # two ways of running the frontend are interchangeable. The production
  # overlay changes SITE_ADDRESS to the real domain and Caddy starts issuing
  # certificates on its own; nothing else about routing changes, which is the
  # point of proxying locally too rather than only in production.
  #
  # There is no VITE_API_BASE_URL. Step 26 made the app's URLs relative, so
  # there is no host compiled into the bundle and nothing to set per
  # environment.
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    image: quantsim-frontend
    container_name: quantsim-frontend
    profiles:
      - app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:5173}
      GATEWAY_UPSTREAM: gateway:8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Caddy writes its certificate store and its runtime config. tmpfs keeps
    # the root filesystem read-only; the production overlay swaps /data for a
    # real volume, because throwing certificates away on every restart is how
    # you meet Let's Encrypt's rate limits.
    tmpfs:
      - /data
      - /config
      - /tmp
    networks:
      default:
        # Fixed, because the gateway's TRUSTED_PROXIES names this address.
        # A DHCP-assigned one would change under the feet of a security
        # control and turn the rate limiter into a single shared bucket
        # without anything failing.
        ipv4_address: 172.28.0.10
    depends_on:
      - gateway
    healthcheck:
      # 5199, not the site port: the site port moves when SITE_ADDRESS
      # becomes a hostname in production. See infra/docker/Caddyfile.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5199/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

# A fixed subnet, so the frontend can have a fixed address for TRUSTED_PROXIES
# above. Docker's default pool is stable in practice and guaranteed nowhere.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  quantsim_pgdata:
  quantsim_redis:
